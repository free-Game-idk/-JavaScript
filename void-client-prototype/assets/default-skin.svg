<!-- default-skin.svg - 简易的 Minecraft 风格占位皮肤 -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="256" viewBox="0 0 64 128">
  <rect width="64" height="128" fill="#7f7f7f"/>
  <!-- head -->
  <rect x="16" y="6" width="32" height="24" fill="#d9b38c" stroke="#000"/>
  <!-- body -->
  <rect x="14" y="34" width="36" height="44" fill="#2b6b9a" stroke="#000"/>
  <!-- arms -->
  <rect x="2" y="34" width="12" height="40" fill="#2b6b9a" stroke="#000"/>
  <rect x="50" y="34" width="12" height="40" fill="#2b6b9a" stroke="#000"/>
  <!-- legs -->
  <rect x="16" y="80" width="14" height="38" fill="#13344f" stroke="#000"/>
  <rect x="34" y="80" width="14" height="38" fill="#13344f" stroke="#000"/>
</svg>
